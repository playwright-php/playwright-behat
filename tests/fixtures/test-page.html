<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        .hidden { display: none; }
        .error { border: 1px solid red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Test Page</h1>
    
    <form id="test-form">
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <div>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="">Select Country</option>
                <option value="us">United States</option>
                <option value="ca">Canada</option>
                <option value="uk">United Kingdom</option>
            </select>
        </div>
        
        <div>
            <label>
                <input type="checkbox" id="terms" name="terms">
                I agree to the terms
            </label>
        </div>
        
        <button type="submit" id="submit-btn">Submit</button>
        <button type="button" id="clear-btn">Clear</button>
    </form>
    
    <div id="message" class="hidden"></div>
    <div id="results" class="hidden">
        <h2>Form Results</h2>
        <ul id="results-list"></ul>
    </div>
    
    <table id="data-table" class="hidden">
        <thead>
            <tr>
                <th data-column="name">Name</th>
                <th data-column="email">Email</th>
                <th data-column="status">Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td data-column="name">John Doe</td>
                <td data-column="email">john@test.com</td>
                <td data-column="status">Active</td>
            </tr>
            <tr>
                <td data-column="name">Jane Smith</td>
                <td data-column="email">jane@test.com</td>
                <td data-column="status">Inactive</td>
            </tr>
        </tbody>
    </table>

    <script>
        const form = document.getElementById('test-form');
        const message = document.getElementById('message');
        const results = document.getElementById('results');
        const resultsList = document.getElementById('results-list');
        const dataTable = document.getElementById('data-table');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            resultsList.innerHTML = '';
            
            for (const [key, value] of formData.entries()) {
                const li = document.createElement('li');
                li.textContent = `${key}: ${value}`;
                resultsList.appendChild(li);
            }
            
            message.textContent = 'Form submitted successfully!';
            message.className = 'success';
            results.classList.remove('hidden');
            dataTable.classList.remove('hidden');
        });
        
        document.getElementById('clear-btn').addEventListener('click', function() {
            form.reset();
            message.className = 'hidden';
            results.classList.add('hidden');
            dataTable.classList.add('hidden');
        });
        
        // Simulate AJAX activity for testing
        let ajaxActive = 0;
        window.jQuery = {
            get active() { return ajaxActive; }
        };
        
        // Test function for JavaScript evaluation
        window.testFunction = function(input) {
            return `processed: ${input}`;
        };
    </script>
</body>
</html>
