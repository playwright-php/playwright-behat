name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  cs:
    uses: playwright-php/.github/.github/workflows/CS.yml@main

  tests:
    name: Tests (PHP ${{ matrix.php }}, Behat ${{ matrix.behat }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        behat: ['^3.23']
        include:
          - php: '8.4'
            behat: '^3.33'

    steps:
      - uses: actions/checkout@v4

      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install PHP deps
        run: |
          composer require "behat/behat:${{ matrix.behat }}" --no-update --no-interaction
          composer update --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit
