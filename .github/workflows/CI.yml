name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  cs:
    uses: playwright-php/.github/.github/workflows/CS.yml@main

  sa:
    uses: playwright-php/.github/.github/workflows/SA.yml@main

  tests:
    name: Tests (PHP ${{ matrix.php }}, Behat ${{ matrix.behat }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        behat: ['^3.23']
        dependencies: ['highest']
        include:
          - php: '8.2'
            behat: '^3.23'
            dependencies: 'lowest'
          - php: '8.4'
            behat: '^4.0'
            dependencies: 'highest'

    steps:
      - uses: actions/checkout@v4

      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install PHP deps
        run: |
          composer require "behat/behat:${{ matrix.behat }}" --no-update --no-interaction
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ms-playwright-${{ runner.os }}-

      - name: Install Playwright (browsers + system deps)
        run: vendor/bin/playwright-install --with-deps

      - name: PHPUnit (unit, integration and a real Behat run)
        run: vendor/bin/phpunit

      - name: Upload screenshots of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-php${{ matrix.php }}-behat${{ matrix.behat }}-${{ matrix.dependencies }}
          path: tests/Fixtures/var/screenshots/
          if-no-files-found: ignore
